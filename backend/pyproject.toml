[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datanexus-backend"
version = "0.1.0"
description = "DataNexus API infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=44,<46",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pymysql>=1.1,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
    "types-pymysql>=1.1,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
cache_dir = "/tmp/datanexus-pytest-cache"
markers = [
    "integration: tests against containerized external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "/tmp/datanexus-ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
cache_dir = "/tmp/datanexus-mypy-cache"

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
